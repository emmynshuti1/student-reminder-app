<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register · CampusPulse</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="container">
      <div class="brand">
        <div class="logo">CP</div>
        <h2>CampusPulse</h2>
      </div>
      <h1 style="margin-top:20px">Create account</h1>
      <p class="subtitle">Track homework, exams, and study sessions.</p>
      <form id="registerForm">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Alex Rivera" required>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@school.edu" required>
        <label for="password">Password (min 6 characters)</label>
        <input type="password" id="password" placeholder="Password" minlength="6" required>
        <p class="error-msg" id="error"></p>
        <button type="submit">Register</button>
        <p>Already have an account? <a href="index.html">Login</a></p>
      </form>
    </div>
  </div>
  <script>
    document.getElementById('registerForm').onsubmit = async function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const error = document.getElementById('error');
      error.textContent = '';
      let data;
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ name, email, password })
        });
        data = await res.json();
      } catch (networkErr) {
        error.textContent = 'Could not reach the CampusPulse server. Run "npm start" and open http://localhost:3000';
        return;
      }
      if (data.success) {
        window.location.href = 'dashboard.html';
      } else {
        error.textContent = data.error || 'Registration failed';
      }
    };
  </script>
</body>
</html>
