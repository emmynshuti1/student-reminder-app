<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · CampusPulse</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-wrap">
    <div class="container">
      <div class="brand">
        <div class="logo">CP</div>
        <div>
          <h2>CampusPulse</h2>
          <p class="subtitle" style="margin:0">Never miss a deadline again</p>
        </div>
      </div>
      <h1 style="margin-top:24px">Welcome back</h1>
      <p class="subtitle">Sign in to your study reminders.</p>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@school.edu" required>
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password" required>
        <p class="error-msg" id="error"></p>
        <button type="submit">Login</button>
        <p>Don't have an account? <a href="register.html">Register</a></p>
      </form>
    </div>
  </div>
  <script>
    fetch('/api/user').then(r => { if (r.ok) location.href = 'dashboard.html'; });
    document.getElementById('loginForm').onsubmit = async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const error = document.getElementById('error');
      error.textContent = '';
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = 'dashboard.html';
      } else {
        error.textContent = data.error || 'Login failed';
      }
    };
  </script>
</body>
</html>
